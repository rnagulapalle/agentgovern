services:
  web:
    image: ${LOOPLABS_IMAGE:-looplabs-web:latest}
    build:
      context: .
      args:
        - NEXT_PUBLIC_WAITLIST_ENDPOINT=${NEXT_PUBLIC_WAITLIST_ENDPOINT:-}
        - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
        - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-/ph}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOOPLABS_DURABLE_ORIGIN=${LOOPLABS_DURABLE_ORIGIN:-https://looplabs.run}
      - LOOPLABS_DATABASE_URL=${LOOPLABS_DATABASE_URL:-}
      - LOOPLABS_REFUND_TWIN_URL=${LOOPLABS_REFUND_TWIN_URL:-}
      - LOOPLABS_REFUND_TWIN_TOKEN=${LOOPLABS_REFUND_TWIN_TOKEN:-}
      - LOOPLABS_CONNECTOR_TWIN_URL=${LOOPLABS_CONNECTOR_TWIN_URL:-}
      - LOOPLABS_CONNECTOR_TWIN_TOKEN=${LOOPLABS_CONNECTOR_TWIN_TOKEN:-}
      - INDEXNOW_KEY=${INDEXNOW_KEY:-a7e9b2c4d5f6a8g0o1v2e3r4n5a6n7a8}
    expose:
      - "3000"
    mem_limit: 1024m
    memswap_limit: 1280m

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
    mem_limit: 64m
