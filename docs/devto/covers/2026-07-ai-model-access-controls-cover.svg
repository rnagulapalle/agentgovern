  <rect x="112" y="118" width="360" height="42" rx="21" fill="#6366f1" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.35"/>
  <text x="292" y="146" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#a5b4fc">REGULATORY · MODEL ACCESS</text>
  <text x="112" y="235" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800" fill="#f8fafc">Model access can change.</text>
  <text x="112" y="306" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800" fill="#818cf8">Your rollout needs a register.</text>
  <text x="112" y="372" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="500" fill="#94a3b8">Track models, owners, approvals, and fallback paths</text>
  <rect x="112" y="450" width="640" height="92" rx="22" fill="#ef4444" fill-opacity="0.12" stroke="#f87171" stroke-opacity="0.4"/>
  <text x="140" y="494" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#fecaca">Risk: overseas access changes without warning</text>
  <text x="140" y="524" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8">Do not discover model dependencies during an outage</text>
  <rect x="900" y="205" width="480" height="430" rx="24" fill="#0f0f14" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="932" y="265" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">Model access register</text>
  <text x="952" y="325" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8">✓ Model behind each workflow</text>
  <text x="952" y="365" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8">✓ Countries and teams with access</text>
  <text x="952" y="405" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8">✓ Actions requiring approval</text>
  <text x="952" y="445" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8">✓ Fallback path if access changes</text>
  <rect x="952" y="505" width="360" height="74" rx="18" fill="#6366f1" fill-opacity="0.14" stroke="#818cf8" stroke-opacity="0.35"/>
  <text x="980" y="550" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#c7d2fe">Access control ≠ action control</text>
