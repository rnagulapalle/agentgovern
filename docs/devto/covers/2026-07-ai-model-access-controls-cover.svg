  <title id="title">AI model access controls Dev.to cover</title>
  <desc id="desc">AgentGovernance cover for AI model access register article</desc>
  <rect width="1600" height="900" fill="#0c0c10"/>
  <rect x="72" y="72" width="1456" height="756" rx="32" fill="#12121a" stroke="#ffffff" stroke-opacity="0.08"/>
