name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: quality-gates
    # One reviewed internal PR uses a one-job runner with a host-owned admission hook.
    # All other PRs and pushes retain the ordinary Ubuntu job.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'rnagulapalle/agentgovern' && github.event.pull_request.head.ref == 'codex/workflow-list-quote-boundary') && 'looplabs-p1p2-reviewed-20261013' || 'ubuntu-latest' }}
    timeout-minutes: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'rnagulapalle/agentgovern' && github.event.pull_request.head.ref == 'codex/workflow-list-quote-boundary') && 45 || 15 }}
    services:
      postgres:
        image: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'rnagulapalle/agentgovern' && github.event.pull_request.head.ref == 'codex/workflow-list-quote-boundary') && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: looplabs
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: looplabs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U looplabs -d looplabs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOOPLABS_OWNED_CI: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'rnagulapalle/agentgovern' && github.event.pull_request.head.ref == 'codex/workflow-list-quote-boundary' }}
      LOOPLABS_TEST_DATABASE_URL: postgresql://looplabs:ci-local-only@127.0.0.1:5432/looplabs_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LOOPLABS_OWNED_CI == 'true' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run reviewed owned full quality
        if: env.LOOPLABS_OWNED_CI == 'true'
        run: /opt/homebrew/bin/node /Users/raj/.codex/looplabs-research/2026-10-13-new-server-migration/integrated-quality/github-ephemeral-p1p2/run-quality.mjs
      - uses: pnpm/action-setup@v4
        if: env.LOOPLABS_OWNED_CI != 'true'
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        if: env.LOOPLABS_OWNED_CI != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.LOOPLABS_OWNED_CI != 'true'
      - run: pnpm quality
        if: env.LOOPLABS_OWNED_CI != 'true'

  staging-temporal-service:
    name: staging-temporal-service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/staging-temporal-service-proof.mjs

  staging-database-container:
    name: staging-database-container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/staging-database-container-proof.mjs
      # The dependency target contains no private FetchSandbox source or spec.
      - run: docker build --target dependencies -f Dockerfile.connector-twin -t looplabs-twin-dependencies:ci .
      - run: docker run --rm --network none --read-only --memory 128m --cap-drop ALL --security-opt no-new-privileges looplabs-twin-dependencies:ci python /app/check-dependencies.py /app/requirements.txt
      - run: docker image rm looplabs-twin-dependencies:ci
