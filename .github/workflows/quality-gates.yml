name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: looplabs
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: looplabs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U looplabs -d looplabs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOOPLABS_TEST_DATABASE_URL: postgresql://looplabs:ci-local-only@127.0.0.1:5432/looplabs_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
        env:
          # Scoped archive tests use this job's PostgreSQL17 client, not an older host client.
          LOOPLABS_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}

  staging-temporal-service:
    name: staging-temporal-service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/staging-temporal-service-proof.mjs

  staging-database-container:
    name: staging-database-container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/staging-database-container-proof.mjs
      # The dependency target contains no private FetchSandbox source or spec.
      - run: docker build --target dependencies -f Dockerfile.connector-twin -t looplabs-twin-dependencies:ci .
      - run: docker run --rm --network none --read-only --memory 128m --cap-drop ALL --security-opt no-new-privileges looplabs-twin-dependencies:ci python /app/check-dependencies.py /app/requirements.txt
      - run: docker image rm looplabs-twin-dependencies:ci
