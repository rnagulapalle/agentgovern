# Optional local PostgreSQL. Keep its password in an ignored environment file.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: looplabs
      POSTGRES_DB: looplabs_durable
      POSTGRES_PASSWORD: ${LOOPLABS_POSTGRES_PASSWORD:?Set a unique local database password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - looplabs_durable_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U looplabs -d looplabs_durable"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  looplabs_durable_local:
