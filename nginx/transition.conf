events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 10m;
    sendfile on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    limit_req_zone $binary_remote_addr zone=web:10m rate=120r/m;

    server {
        listen 80;
        server_name agentgovern.ai www.agentgovern.ai;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://agentgovern.ai$request_uri; }
    }

    server {
        listen 80;
        server_name looplabs.run www.looplabs.run;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://looplabs.run$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name www.agentgovern.ai;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://agentgovern.ai$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name agentgovern.ai;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / {
            limit_req zone=web burst=60 nodelay;
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name www.looplabs.run;
        ssl_certificate /etc/nginx/certs/looplabs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/looplabs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://looplabs.run$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name looplabs.run;
        ssl_certificate /etc/nginx/certs/looplabs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/looplabs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / {
            limit_req zone=web burst=60 nodelay;
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
