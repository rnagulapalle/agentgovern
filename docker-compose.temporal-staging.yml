# Explicit separate staging file. The production deploy script does not start it.
services:
  temporal-worker:
    image: ${LOOPLABS_TEMPORAL_IMAGE:?Use a built and pinned staging image}
    command: ["node", ".worker/temporal-service.cjs", "worker"]
    env_file: [.local/temporal-staging.env]
    environment:
      LOOPLABS_TEMPORAL_HEALTH_PORT: "9320"
    volumes:
      - ${LOOPLABS_TEMPORAL_TLS_DIR:?Provide a private TLS directory}:/run/temporal-tls:ro
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9320/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
  temporal-scheduler:
    image: ${LOOPLABS_TEMPORAL_IMAGE:?Use a built and pinned staging image}
    command: ["node", ".worker/temporal-service.cjs", "scheduler"]
    env_file: [.local/temporal-staging.env]
    environment:
      LOOPLABS_TEMPORAL_HEALTH_PORT: "9321"
    volumes:
      - ${LOOPLABS_TEMPORAL_TLS_DIR:?Provide a private TLS directory}:/run/temporal-tls:ro
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9321/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
